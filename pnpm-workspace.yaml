overrides:
  "@babel/core": 7.29.6
  qs: ^6.15.2
  joi: 17.13.4
  body-parser: ^1.20.6
  brace-expansion@^1.1.7: ^5.0.9
  brace-expansion@^5.0.2: ^5.0.9
  fast-uri: ^3.1.5
  js-yaml: 4.3.1
  launch-editor: 2.14.1
  nanoid: ^3.3.18
  shell-quote: ^1.9.0
  serialize-javascript: ^7.0.5
  uuid: ^14.0.0
  svgo: ^3.3.4
  "@babel/plugin-transform-modules-systemjs": ">=7.29.4"
  undici: ^7.29.0
  webpack-dev-server: ^5.2.6
  websocket-driver: ^0.7.5
  ws: 8.21.0

patchedDependencies:
  gray-matter@4.0.3: patches/gray-matter@4.0.3.patch
  # image-size is pulled in transitively by @docusaurus/mdx-loader, which calls
  # imageSizeFromFile() at build time. Upstream archived the repo on 2026-06-03
  # leaving CVE-2025-71329 (JXL/HEIF) and CVE-2025-71330 (ICNS) unfixed -- both
  # are infinite-loop DoS bugs where a zero-length entry never advances the read
  # offset. The patch adds forward-progress guards to the three affected loops.
  # esbuild inlines the parsers into every entry bundle, hence 16 files touched.
  image-size@2.0.2: patches/image-size@2.0.2.patch

peerDependencyRules:
  allowedVersions:
    # @docusaurus/eslint-plugin internally uses @typescript-eslint/utils@5.x
    # which only declares eslint ^6-8, but the plugin itself works fine with 9.
    eslint: "9"

onlyBuiltDependencies:
  - '@swc/core'
  - core-js
  - core-js-pure

packages:
  - .
